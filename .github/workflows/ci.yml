name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    # The store tests are about what Postgres refuses, so they need a real one. It lives only for
    # this job and holds no data, hence no password.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l server)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on: $unformatted"; exit 1; fi
      - name: vet
        run: go -C server vet ./...
      - name: test
        run: |
          set -o pipefail  # without it the step would report tee's result, not the tests'
          go -C server test -v ./... | tee "$RUNNER_TEMP/go-test.log"
          # A skipped test proves nothing: here every test has what it needs, the database included.
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/go-test.log"; then echo "A test was skipped in CI."; exit 1; fi

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: lint
        run: npm --prefix web run lint
      - name: types
        run: npm --prefix web run typecheck
      - name: test
        run: npm --prefix web test
      - name: build
        run: npm --prefix web run build
      - name: no secret in the built app
        run: |
          # Everything in web/dist is public. A server secret's name or a GitHub token in it is a leak.
          if grep -rIlE 'gho_|client_secret|APP_SECRET|AUTH_SECRET' web/dist; then
            echo "A secret-looking string is in the built web app (files above)."
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No secret-looking strings in tracked files
        run: |
          pattern='sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY|(NEXCONN_APP_SECRET|AUTH_SECRET|AUTH_GITHUB_SECRET)=[A-Za-z0-9+/_-]{8,}|postgres(ql)?://[^[:space:]:@/]+:[^[:space:]@/]+@'
          if git grep -nIE "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo "A secret-looking string is committed. Remove it and rotate that secret."
            exit 1
          fi
