<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live office hours for open source projects. Contributors raise a hand, maintainers answer one at a time, and every answer becomes a public FAQ link."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230047FF'/%3E%3Cpath d='M8 20a8 8 0 0 1 16 0z' fill='white'/%3E%3Ccircle cx='16' cy='24' r='2' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google's stylesheet held the first paint, and the app's script with it, for 750 ms on a
         phone (Lighthouse, 2026-11-13). It is fetched early without blocking and applied when it
         arrives; the text swaps to these fonts then (display=swap) (NFR-PERF-2). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@1&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <title>Office Hours</title>
    <!-- The landing has a dark mode of its own (styles/landing.css). Its class is set here, before
         the first paint, so a dark system never sees the light page first; the landing removes it
         when another page is shown.
         The landing and a room's join card open on the meadow photo, which React or CSS would only
         ask for once the app has loaded. It is fetched from here instead, so their largest paint
         stays under 2.5 s on a phone (NFR-PERF-2). On a phone in portrait the join card shows a
         narrow slice of it, so it gets that slice (17 KB, not 59): the query below is the one in
         app.css's .gate rule. A member's room doesn't show the photo: they fetch it for nothing. -->
    <script>
      {
        const path = location.pathname;
        const isRoom = /^\/p\/[^/]+\/[^/]+\/?$/.test(path);
        if (path === "/") document.documentElement.classList.add("land-page");
        if (path === "/" || isRoom) {
          const isPhone = matchMedia(
            "(max-width: 760px) and (orientation: portrait)",
          ).matches;
          const photo = document.createElement("link");
          photo.rel = "preload";
          photo.as = "image";
          photo.href =
            isRoom && isPhone
              ? "/hero-meadow-portrait.webp"
              : "/hero-meadow.webp";
          photo.fetchPriority = "high";
          document.head.append(photo);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
